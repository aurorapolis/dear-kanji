<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程調整の文章 | dear幹事</title>
<style>
:root{
  --ai:#16304d;
  --kami:#f7f4ec;
  --sumi:#23201c;
  --usuzumi:#7a736b;
  --keisen:#d8d0bd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ai);
  color:var(--sumi);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:15px;
  line-height:1.75;
  padding:0 0 64px;
}
.maki{max-width:640px;margin:0 auto;padding:0 14px}
.noren{
  background:var(--ai);
  color:var(--kami);
  padding:28px 22px 22px;
  text-align:center;
}
.noren{position:relative}
.noren h1{font-size:20px;font-weight:400;line-height:1.5}
/* v4 左上の✕(「dear幹事にもどる」と同じ) */
.batsu{
  position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;
  width:40px;height:40px;padding:0;margin:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font:inherit;font-size:20px;line-height:1;color:var(--kami);
  background:rgba(247,244,236,.08);border:1px solid rgba(247,244,236,.45);border-radius:50%;
}
.batsu:active{transform:scale(.95)}
.batsu:focus-visible{outline:2px solid #d9bf85;outline-offset:2px}
.dan{
  background:var(--kami);
  border-radius:3px;
  margin-top:14px;
  padding:22px 18px 24px;
}
.oshirase{font-size:13.5px;margin-bottom:14px}
.setsumei{font-size:12.5px;color:var(--usuzumi);margin-bottom:14px}

/* ── v2 会の雰囲気(dear幹事の「一 会のこと」で選んだものを、最初から選んでおく) ── */
.funikiLabel{display:block;font-size:12.5px;color:var(--usuzumi);margin:0 0 5px;letter-spacing:.04em}
.funiki{display:flex;gap:8px;margin-bottom:16px}
.funiki button{
  flex:1;font:inherit;cursor:pointer;margin:0;
  padding:9px 6px;font-size:14px;letter-spacing:.04em;
  background:#fff;color:var(--ai);border:1px solid var(--keisen);border-radius:2px;
  display:flex;align-items:center;justify-content:center;
}
.funiki button[aria-pressed="true"]{background:var(--ai);color:var(--kami);border-color:var(--ai);font-weight:600}
.funiki .funE{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:6px;border-radius:50%;background:var(--kami);border:1px solid var(--keisen);font-size:14px;line-height:1}
.funiki button[aria-pressed="true"] .funE{border-color:#d9bf85;box-shadow:0 0 0 1px #d9bf85}

/* ── タブ ── */
.tabu{
  display:flex;
  gap:0;
  border-bottom:2px solid var(--ai);
}
.tabu button{
  flex:1;
  width:auto;
  margin:0;
  padding:10px 6px 9px;
  font-size:14px;
  letter-spacing:.02em;
  background:transparent;
  color:var(--usuzumi);
  border:1px solid var(--keisen);
  border-bottom:none;
  border-radius:3px 3px 0 0;
  line-height:1.4;
}
.tabu button + button{margin-left:6px}
.tabu button[aria-selected="true"]{
  background:var(--ai);
  color:var(--kami);
  border-color:var(--ai);
}
.tabu button:active{transform:none}
.tabu small{display:block;font-size:11px;opacity:.8;margin-top:1px}

textarea{
  width:100%;
  font:inherit;
  font-size:15.5px;
  line-height:1.8;
  padding:12px;
  border:1px solid var(--keisen);
  border-top:none;
  border-radius:0 0 2px 2px;
  background:#fff;
  color:var(--sumi);
  resize:vertical;
  display:block;
}
textarea:focus{outline:2px solid var(--ai);outline-offset:1px}
.sousa button{
  font:inherit;
  cursor:pointer;
  border-radius:2px;
  border:1px solid var(--ai);
  background:var(--ai);
  color:var(--kami);
  padding:11px 16px;
  letter-spacing:.05em;
  width:100%;
  margin-top:12px;
}
.sousa button.usu{background:transparent;color:var(--ai)}
.sousa button:active{transform:translateY(1px)}
.modoru{
  display:inline-block;
  margin-top:18px;
  font-size:13px;
  color:var(--kami);
  text-decoration:underline;
}
</style>
</head>
<body>

<div class="noren">
  <button type="button" class="batsu" id="batsu" aria-label="dear幹事にもどる">✕</button>
  <h1>日程調整の文章をつくろう！<br>（日程調整アプリなどを使わない方へ！）</h1>
</div>

<div class="maki">
  <div class="dan">
    <p class="oshirase">
      まずは大事な最初の一歩を一緒に始めましょう！
    </p>
    <p class="setsumei" id="setsumei">
      候補日を書きかえたり、言い回しを直したりして、自由に使ってください。<br>
      使わない方は、このページは無視してもらって大丈夫です。
    </p>

    <span class="funikiLabel">会の雰囲気</span>
    <div class="funiki" id="funiki" role="group" aria-label="会の雰囲気">
      <button type="button" data-fun="shoku" aria-pressed="true"><span class="funE" aria-hidden="true">🏢</span>職場の会</button>
      <button type="button" data-fun="tomo" aria-pressed="false"><span class="funE" aria-hidden="true">🍻</span>友だちの会</button>
    </div>

    <div class="tabu" role="tablist">
      <button type="button" role="tab" id="tab-kiku" aria-selected="true">日づけをきく<small>みんなの都合を聞く</small></button>
      <button type="button" role="tab" id="tab-kimeta" aria-selected="false">日づけは決めている<small>出欠だけ聞く</small></button>
    </div>
    <textarea id="bun" rows="18"></textarea>

    <div class="sousa">
      <button type="button" id="copy">コピーする</button>
      <button type="button" class="usu" id="reset">もとの文章に戻す</button>
    </div>
  </div>
  <a class="modoru" href="index.html" id="modoru">← dear幹事にもどる</a>
</div>

<script>
function el(id){ return document.getElementById(id); }

/* ── ひな形(v2 職場の会 shoku ／ 友だちの会 tomo の2種類ずつ) ── */
var MOTO = {
  shoku: {
    kiku:
'おつかれさまです。[部署名]の[自分の名前]です。\n\n' +
'この度、[イベント名（例：〇〇さんの送別会）]の幹事を務めさせていただくことになりました。\n\n' +
'さっそくですが、開催に向けて皆様の日程を調整したくご連絡いたしました。\n\n' +
'日程を決めたいと思います。\n' +
'参加できそうな日を【〇月〇日(〇)まで】に、このメールへの返信で教えてください。\n\n' +
'【候補日】\n' +
'・　　月　　日（　）\n' +
'・　　月　　日（　）\n' +
'・　　月　　日（　）\n\n' +
'※上記以外にご都合の良い日があれば、あわせて教えていただけますと幸いです。\n\n' +
'※不参加の場合は、その旨をこの返信で伝えて頂いても構いません。\n\n' +
'日程が固まり次第、あらためてご連絡します。\n' +
'よろしくお願いいたします。',

    kimeta:
'おつかれさまです。[部署名]の[自分の名前]です。\n\n' +
'この度、[イベント名（例：〇〇さんの送別会）]の幹事を務めさせていただくことになりました。\n\n' +
'開催日が決まりましたので、ご案内いたします。\n\n' +
'【日時】　　月　　日（　）　　時　　分〜\n\n' +
'【場所】\n' +
'①[お店の名前]\n' +
'②[◯◯駅周辺で考え中です]\n' +
'③[決まり次第ご連絡します]\n\n' +
'【会費】\n' +
'①[〇〇〇〇円くらい]\n' +
'②[決まり次第ご連絡します]\n\n' +
'お手数ですが、参加・不参加を【〇月〇日(〇)まで】に、このメールへの返信で教えてください。\n\n' +
'※ご都合が合わない場合も、その旨を返信いただけると助かります。\n\n' +
'※途中参加・途中退席も大歓迎です。あわせて教えていただけますと幸いです。\n\n' +
'会の詳細は、決まり次第あらためてご連絡します。\n' +
'よろしくお願いいたします。'
  },
  tomo: {
    kiku:
'おつかれ！[自分の名前]です🍻\n\n' +
'[イベント名（例：〇〇の誕生日会）]の幹事をやることになりました！\n\n' +
'みんなの都合を聞きたいので、行けそうな日を【〇月〇日(〇)まで】に教えてね🙏\n\n' +
'【候補日】\n' +
'・　　月　　日（　）\n' +
'・　　月　　日（　）\n' +
'・　　月　　日（　）\n\n' +
'※ほかに都合のいい日があれば、それも教えてもらえるとうれしい！\n\n' +
'※今回むずかしい人も、ひと言もらえると助かります。\n\n' +
'日にちが決まったら、また連絡するね。よろしく！',

    kimeta:
'おつかれ！[自分の名前]です🍻\n\n' +
'[イベント名（例：〇〇の誕生日会）]の日にちが決まったので、お知らせです！\n\n' +
'📅　　月　　日（　）　　時　　分〜\n\n' +
'📍 場所\n' +
'①[お店の名前]\n' +
'②[◯◯駅のあたりで考え中]\n' +
'③[決まったら連絡するね]\n\n' +
'💰 会費\n' +
'①[〇〇〇〇円くらい]\n' +
'②[決まったら連絡するね]\n\n' +
'来られるかどうか、【〇月〇日(〇)まで】に返信もらえるとうれしい！\n\n' +
'※都合が合わないときも、ひと言もらえると助かります。\n\n' +
'※途中参加・途中で帰るのも大歓迎！\n\n' +
'くわしいことは、決まったらまた連絡するね。よろしく！'
  }
};

var SETSUMEI = {
  kiku:  '候補日を書きかえたり、言い回しを直したりして、自由に使ってください。<br>書いた文章は、この端末に自動で保存されます。<br>使わない方は、このページは無視してもらって大丈夫です。',
  kimeta:'日時やお店を書きかえたり、言い回しを直したりして、自由に使ってください。<br>書いた文章は、この端末に自動で保存されます。<br>使わない方は、このページは無視してもらって大丈夫です。'
};

/* v2 dear幹事で選んだ「会の雰囲気」を読む(同じ端末に保存された、いま開いている会の設定)。読めなければ職場の会 */
var fun = 'shoku';
try{
  var hako = JSON.parse(localStorage.getItem('dear-kanji-hako') || 'null');
  if(hako && hako.f && hako.f.funikiAtai === 'tomo') fun = 'tomo';
}catch(e){}

/* 雰囲気とタブごとに、書きかえた内容を覚えておく（切りかえても消えない） */
var ima = 'kiku';

/* v4 このページで最後に選んでいた雰囲気とタブで開く(まだ選んだことがなければ、dear幹事で選んでいる雰囲気) */
var ERABI = 'dear-kanji-nittei-erabi';
try{
  var erabi = JSON.parse(localStorage.getItem(ERABI) || 'null');
  if(erabi){
    if(erabi.fun === 'shoku' || erabi.fun === 'tomo') fun = erabi.fun;
    if(erabi.tab === 'kiku' || erabi.tab === 'kimeta') ima = erabi.tab;
  }
}catch(e){}
function erabiHozon(){
  try{ localStorage.setItem(ERABI, JSON.stringify({ fun: fun, tab: ima })); }catch(e){}
}
var kakikae = {
  shoku: { kiku: MOTO.shoku.kiku, kimeta: MOTO.shoku.kimeta },
  tomo:  { kiku: MOTO.tomo.kiku,  kimeta: MOTO.tomo.kimeta }
};

/* v3 書きかえた文章は、この端末に自動で保存する(スマホの戻るボタンで戻っても消えない) */
var HOZON = 'dear-kanji-nittei';
try{
  var nokori = JSON.parse(localStorage.getItem(HOZON) || 'null');
  if(nokori && typeof nokori === 'object'){
    ['shoku','tomo'].forEach(function(f){
      ['kiku','kimeta'].forEach(function(t){
        if(nokori[f] && typeof nokori[f][t] === 'string') kakikae[f][t] = nokori[f][t];
      });
    });
  }
}catch(e){}
function hozon(){
  kakikae[fun][ima] = el('bun').value;
  try{ localStorage.setItem(HOZON, JSON.stringify(kakikae)); }catch(e){}
}

function hyouji(){
  el('bun').value = kakikae[fun][ima];
  el('setsumei').innerHTML = SETSUMEI[ima];
  el('tab-kiku').setAttribute('aria-selected', ima === 'kiku' ? 'true' : 'false');
  el('tab-kimeta').setAttribute('aria-selected', ima === 'kimeta' ? 'true' : 'false');
  Array.prototype.forEach.call(el('funiki').querySelectorAll('button[data-fun]'), function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-fun') === fun ? 'true' : 'false');
  });
}
hyouji();
el('bun').addEventListener('input', hozon);
window.addEventListener('pagehide', hozon);
document.addEventListener('visibilitychange', function(){ if(document.hidden) hozon(); });

function kirikae(tsugi){
  if(tsugi === ima) return;
  hozon();
  ima = tsugi;
  erabiHozon();
  hyouji();
}
el('tab-kiku').addEventListener('click', function(){ kirikae('kiku'); });
el('tab-kimeta').addEventListener('click', function(){ kirikae('kimeta'); });

el('funiki').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button[data-fun]') : null;
  if(!b) return;
  var tsugi = b.getAttribute('data-fun');
  if(tsugi === fun) return;
  hozon();
  fun = tsugi;
  erabiHozon();
  hyouji();
});

/* v3 自動で保存するようになったので、「もどる」の確認はなくした
   v4 dear幹事から来たときは、ブラウザの「戻る」と同じ動きで戻る(画面の位置もそのまま)。
      それ以外(このページを直接ひらいた等)は、dear幹事をひらき直す。位置は dear幹事の側で、出かけたボタンのところへ戻す */
function modoru(e){
  if(e) e.preventDefault();
  hozon();
  var ref = document.referrer || '';
  var onaji = false;
  try{ onaji = !!ref && new URL(ref).origin === location.origin && location.origin !== 'null'; }catch(x){}
  if(onaji && history.length > 1){ history.back(); return; }
  location.href = 'index.html';
}
el('modoru').addEventListener('click', modoru);
el('batsu').addEventListener('click', modoru);

function furui(moji){
  try{
    var ta = document.createElement('textarea');
    ta.value = moji;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function utsusu(moji, botan){
  var owari = function(){
    var m0 = botan.textContent;
    botan.textContent = 'コピーしました';
    setTimeout(function(){ botan.textContent = m0; }, 1600);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(moji).then(owari, function(){
        if(furui(moji)) owari();
        else { el('bun').focus(); el('bun').select(); }
      });
      return;
    }
  }catch(e){}
  if(furui(moji)) owari();
  else { el('bun').focus(); el('bun').select(); }
}

el('copy').addEventListener('click', function(){
  utsusu(el('bun').value, el('copy'));
});
el('reset').addEventListener('click', function(){
  var namae = (ima === 'kiku') ? '「日づけをきく」' : '「日づけは決めている」';
  if(!confirm(namae + 'の書きかえた文章を消して、もとの文章に戻します。よろしいですか。')) return;
  if(!confirm('本当に戻しますか？書きかえた内容は元に戻せません。')) return;
  el('bun').value = MOTO[fun][ima];
  hozon();
});
</script>
</body>
</html>
