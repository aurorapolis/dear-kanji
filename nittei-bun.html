<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程調整の文章 | dear幹事</title>
<style>
:root{
  --ai:#16304d;
  --kami:#f7f4ec;
  --sumi:#23201c;
  --usuzumi:#7a736b;
  --keisen:#d8d0bd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--ai);
  color:var(--sumi);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:15px;
  line-height:1.75;
  padding:0 0 64px;
}
.maki{max-width:640px;margin:0 auto;padding:0 14px}
.noren{
  background:var(--ai);
  color:var(--kami);
  padding:28px 22px 22px;
  text-align:center;
}
.noren h1{font-size:20px;font-weight:400;line-height:1.5}
.dan{
  background:var(--kami);
  border-radius:3px;
  margin-top:14px;
  padding:22px 18px 24px;
}
.oshirase{font-size:13.5px;margin-bottom:14px}
.setsumei{font-size:12.5px;color:var(--usuzumi);margin-bottom:14px}

/* ── タブ ── */
.tabu{
  display:flex;
  gap:0;
  border-bottom:2px solid var(--ai);
}
.tabu button{
  flex:1;
  width:auto;
  margin:0;
  padding:10px 6px 9px;
  font-size:14px;
  letter-spacing:.02em;
  background:transparent;
  color:var(--usuzumi);
  border:1px solid var(--keisen);
  border-bottom:none;
  border-radius:3px 3px 0 0;
  line-height:1.4;
}
.tabu button + button{margin-left:6px}
.tabu button[aria-selected="true"]{
  background:var(--ai);
  color:var(--kami);
  border-color:var(--ai);
}
.tabu button:active{transform:none}
.tabu small{display:block;font-size:11px;opacity:.8;margin-top:1px}

textarea{
  width:100%;
  font:inherit;
  font-size:15.5px;
  line-height:1.8;
  padding:12px;
  border:1px solid var(--keisen);
  border-top:none;
  border-radius:0 0 2px 2px;
  background:#fff;
  color:var(--sumi);
  resize:vertical;
  display:block;
}
textarea:focus{outline:2px solid var(--ai);outline-offset:1px}
.sousa button{
  font:inherit;
  cursor:pointer;
  border-radius:2px;
  border:1px solid var(--ai);
  background:var(--ai);
  color:var(--kami);
  padding:11px 16px;
  letter-spacing:.05em;
  width:100%;
  margin-top:12px;
}
.sousa button.usu{background:transparent;color:var(--ai)}
.sousa button:active{transform:translateY(1px)}
.modoru{
  display:inline-block;
  margin-top:18px;
  font-size:13px;
  color:var(--kami);
  text-decoration:underline;
}
</style>
</head>
<body>

<div class="noren">
  <h1>日程調整の文章をつくろう！<br>（日程調整アプリなどを使わない方へ！）</h1>
</div>

<div class="maki">
  <div class="dan">
    <p class="oshirase">
      まずは大事な最初の一歩を一緒に始めましょう！
    </p>
    <p class="setsumei" id="setsumei">
      候補日を書きかえたり、言い回しを直したりして、自由に使ってください。<br>
      使わない方は、このページは無視してもらって大丈夫です。
    </p>

    <div class="tabu" role="tablist">
      <button type="button" role="tab" id="tab-kiku" aria-selected="true">日づけをきく<small>みんなの都合を聞く</small></button>
      <button type="button" role="tab" id="tab-kimeta" aria-selected="false">日づけは決めている<small>出欠だけ聞く</small></button>
    </div>
    <textarea id="bun" rows="18"></textarea>

    <div class="sousa">
      <button type="button" id="copy">コピーする</button>
      <button type="button" class="usu" id="reset">もとの文章に戻す</button>
    </div>
  </div>
  <a class="modoru" href="index.html" id="modoru">← dear幹事にもどる</a>
</div>

<script>
function el(id){ return document.getElementById(id); }

/* ── 2つのひな形 ── */
var MOTO = {
  kiku:
'おつかれさまです。[部署名]の[自分の名前]です。\n\n' +
'この度、[イベント名（例：〇〇さんの送別会）]の幹事を務めさせていただくことになりました。\n\n' +
'さっそくですが、開催に向けて皆様の日程を調整したくご連絡いたしました。\n\n' +
'日程を決めたいと思います。\n' +
'参加できそうな日を【〇月〇日(〇)まで】に、このメールへの返信で教えてください。\n\n' +
'【候補日】\n' +
'・　　月　　日（　）\n' +
'・　　月　　日（　）\n' +
'・　　月　　日（　）\n\n' +
'※上記以外にご都合の良い日があれば、あわせて教えていただけますと幸いです。\n\n' +
'※不参加の場合は、その旨をこの返信で伝えて頂いても構いません。\n\n' +
'日程が固まり次第、あらためてご連絡します。\n' +
'よろしくお願いいたします。',

  kimeta:
'おつかれさまです。[部署名]の[自分の名前]です。\n\n' +
'この度、[イベント名（例：〇〇さんの送別会）]の幹事を務めさせていただくことになりました。\n\n' +
'開催日が決まりましたので、ご案内いたします。\n\n' +
'【日時】　　月　　日（　）　　時　　分〜\n\n' +
'【場所】\n' +
'①[お店の名前]\n' +
'②[◯◯駅周辺で考え中です]\n' +
'③[決まり次第ご連絡します]\n\n' +
'【会費】\n' +
'①[〇〇〇〇円くらい]\n' +
'②[決まり次第ご連絡します]\n\n' +
'お手数ですが、参加・不参加を【〇月〇日(〇)まで】に、このメールへの返信で教えてください。\n\n' +
'※ご都合が合わない場合も、その旨を返信いただけると助かります。\n\n' +
'※途中参加・途中退席も大歓迎です。あわせて教えていただけますと幸いです。\n\n' +
'会の詳細は、決まり次第あらためてご連絡します。\n' +
'よろしくお願いいたします。'
};

var SETSUMEI = {
  kiku:  '候補日を書きかえたり、言い回しを直したりして、自由に使ってください。<br>使わない方は、このページは無視してもらって大丈夫です。',
  kimeta:'日時やお店を書きかえたり、言い回しを直したりして、自由に使ってください。<br>使わない方は、このページは無視してもらって大丈夫です。'
};

/* タブごとに書きかえた内容を覚えておく（切りかえても消えない） */
var ima = 'kiku';
var kakikae = { kiku: MOTO.kiku, kimeta: MOTO.kimeta };
el('bun').value = kakikae[ima];

function kirikae(tsugi){
  if(tsugi === ima) return;
  kakikae[ima] = el('bun').value;
  ima = tsugi;
  el('bun').value = kakikae[ima];
  el('setsumei').innerHTML = SETSUMEI[ima];
  el('tab-kiku').setAttribute('aria-selected', ima === 'kiku' ? 'true' : 'false');
  el('tab-kimeta').setAttribute('aria-selected', ima === 'kimeta' ? 'true' : 'false');
}
el('tab-kiku').addEventListener('click', function(){ kirikae('kiku'); });
el('tab-kimeta').addEventListener('click', function(){ kirikae('kimeta'); });

el('modoru').addEventListener('click', function(e){
  if(!confirm('dear幹事にもどりますか？書きかえた文章は消えます。')) { e.preventDefault(); return; }
  if(!confirm('本当にもどりますか？')) { e.preventDefault(); return; }
});

function furui(moji){
  try{
    var ta = document.createElement('textarea');
    ta.value = moji;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function utsusu(moji, botan){
  var owari = function(){
    var m0 = botan.textContent;
    botan.textContent = 'コピーしました';
    setTimeout(function(){ botan.textContent = m0; }, 1600);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(moji).then(owari, function(){
        if(furui(moji)) owari();
        else { el('bun').focus(); el('bun').select(); }
      });
      return;
    }
  }catch(e){}
  if(furui(moji)) owari();
  else { el('bun').focus(); el('bun').select(); }
}

el('copy').addEventListener('click', function(){
  utsusu(el('bun').value, el('copy'));
});
el('reset').addEventListener('click', function(){
  var namae = (ima === 'kiku') ? '「日づけをきく」' : '「日づけは決めている」';
  if(!confirm(namae + 'の書きかえた文章を消して、もとの文章に戻します。よろしいですか。')) return;
  if(!confirm('本当に戻しますか？書きかえた内容は元に戻せません。')) return;
  el('bun').value = MOTO[ima];
  kakikae[ima] = MOTO[ima];
});
</script>
</body>
</html>
